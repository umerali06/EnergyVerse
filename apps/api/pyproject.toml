[tool.poetry]
name = "fev-api"
version = "0.8.0"
description = "Flacron EnergyVerse API"
authors = ["FEV Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {version = "^0.34.0", extras = ["standard"]}
pydantic-settings = "^2.7.0"
firebase-admin = "^7.0.0"
python-multipart = "^0.0.32"
tzdata = "^2026.3"
anthropic = "^0.69.0"
reportlab = "^4.4.0"
python-docx = "^1.2.0"
openpyxl = "^3.1.5"
pypdf = "^6.0.0"
stripe = "^15.6.1"
av = "^13.1.0"
pillow = ">=11.0,<13"
boto3 = "^1.35.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.28.0"
ruff = "^0.9.0"
mypy = "^1.14.0"
types-openpyxl = "^3.1.5.20260807"
types-reportlab = "^4.5.1.20260807"
boto3-stubs = "^1.35.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Transactional email is inline-styled HTML: mail clients strip <style> blocks,
# so every rule has to live on the element and the lines cannot wrap without
# injecting whitespace into the rendered output.
"app/email/templates.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires configured external services",
]
