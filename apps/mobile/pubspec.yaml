name: fev_mobile
description: Flacron EnergyVerse Field App
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  dio: 5.7.0
  fev_api_client:
    path: ../../packages/contracts/generated/dart-dio
  shared_preferences: 2.3.2
  firebase_core: 4.12.1
  firebase_auth: 6.5.6
  fl_chart: ^1.2.0
  timezone: ^0.9.4
  built_collection: ^5.1.1
  built_value: ^8.9.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  mobile_scanner: ^7.0.1
  uuid: ^4.5.1
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.29
  path_provider: ^2.1.5
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  geolocator: ^13.0.2
  # Pinned to whatever fev_api_client (a path dependency) already resolves.
  # A real dependency (not dev-only) since Phase 7.3's checklist-fill screen
  # constructs `ChecklistResponse.value` (an AnyOf) at runtime, not just in
  # test fixtures.
  one_of: 1.5.0
  camera: ^0.12.0+2
  firebase_storage: ^13.4.5
  video_player: ^2.13.0
  video_thumbnail: ^0.5.6
  record: ^5.2.0
  audioplayers: ^6.1.0
  # Phase 7.9 AR spike. Community fork of the abandoned ar_flutter_plugin;
  # see DECISIONS.md D-062 for the maintenance-risk tradeoff and the plan
  # to fall back to native platform channels if it fails device validation.
  ar_flutter_plugin_2: ^0.0.3
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.23.0
  build_runner: ^2.4.13
  fake_async: ^1.3.1
  geolocator_platform_interface: ^4.2.8

# ar_flutter_plugin_2 (Phase 7.9) pins geolocator ^12.0.0, but this app is
# already on ^13.0.2 (Phase 7.3 GPS capture). Its only geolocator usage
# (ARLocationManager) is limited to stable, version-independent calls, so
# forcing 13.x here is safe -- verified by `flutter pub get` + `flutter
# analyze` passing clean. Revisit if ar_flutter_plugin_2 ever bumps its own
# geolocator constraint.
dependency_overrides:
  geolocator: ^13.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
