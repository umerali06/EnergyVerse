# AWS Amplify build spec for the Next.js admin app.
#
# This file lives at the repository root because Amplify looks for it there,
# but the app itself is at apps/admin -- set "Monorepo app root" to apps/admin
# in the Amplify console (or `appRoot` if you switch to the multi-app format).
#
# Amplify must host this as a Next.js SSR app (platform WEB_COMPUTE), not as a
# static export: the admin uses server components and route handlers, so a
# static build would drop them. Amplify detects this automatically from the
# .next output; do not add `output: "export"` to next.config.ts.
#
# Every NEXT_PUBLIC_* value is baked in at BUILD time, not read at runtime.
# Changing one in the Amplify console therefore requires a redeploy to take
# effect -- restarting the app is not enough.

version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify's image ships Node 18 by default; the repo builds on 20 in CI
        # and the two must not drift.
        - nvm use 20 || nvm install 20
        - corepack enable
        - corepack prepare pnpm@9 --activate
        # --frozen-lockfile fails loudly if the lockfile and package.json have
        # diverged, rather than silently resolving something CI never tested.
        - pnpm install --frozen-lockfile
    build:
      commands:
        # Fail the deployment on a type error. `next build` type-checks the app,
        # but test files are in tsconfig and are not exercised by it, so run tsc
        # explicitly first -- this repo has shipped a green build with failing
        # tsc before.
        - npx tsc --noEmit
        - pnpm run build
  artifacts:
    # .next is the SSR build output Amplify deploys for WEB_COMPUTE apps.
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
