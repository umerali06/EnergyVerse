version: 1
applications:
  - appRoot: apps/admin
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20 || nvm install 20
            - corepack enable
            - corepack prepare pnpm@9 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - npx tsc --noEmit
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
